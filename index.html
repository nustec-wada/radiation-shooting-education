<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>放射線シューティング ～放射線教育ゲーム～</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>html,body,#root{margin:0;min-height:100%;background:#020617}body{min-height:100vh}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useEffect, useRef, useState } = React;

const W = 900;
const H = 540;

const DIFFICULTIES = {
  easy: { label: "EASY", factor: 0.45 },
  normal: { label: "NORMAL", factor: 0.7 },
  hard: { label: "HARD", factor: 1 },
};

const WEAPONS = {
  alpha: { name: "α線", color: "#f97316", speed: 5, damage: 150, life: 48, desc: "短射程・高威力・撃破ボーナス" },
  beta: { name: "β線", color: "#22c55e", speed: 7, damage: 28, life: 88, desc: "ジグザグ・中距離" },
  gamma: { name: "γ線", color: "#60a5fa", speed: 30, damage: 13, life: 38, desc: "超高速・高透過" },
  neutron: { name: "中性子線", color: "#a78bfa", speed: 9, damage: 3, life: 90, desc: "人体模型にのみ高威力" },
};
const MATERIALS = { paper:{label:"紙",color:"#f8fafc"}, aluminum:{label:"アルミニウム",color:"#94a3b8"}, concrete:{label:"コンクリート",color:"#64748b"}, water:{label:"水",color:"#38bdf8"} };
const radiationDemoStage=()=>({player:{x:80,y:H/2},shots:[],barriers:[],targets:[{x:650,y:70,w:48,h:48,hp:80,max:80,type:"normal",label:"標的A",speed:0},{x:540,y:205,w:42,h:78,hp:90,max:90,type:"human",label:"人体模型",speed:0},{x:430,y:430,w:48,h:48,hp:100,max:100,type:"normal",label:"標的B",speed:0},{x:225,y:285,w:48,h:48,hp:140,max:140,type:"normal",label:"標的C",speed:0}]});
const shieldDemoStage=()=>({player:{x:80,y:H/2},shots:[],targets:[],barriers:[{x:285,y:218,w:24,h:105,material:"paper"},{x:420,y:213,w:28,h:115,material:"aluminum"},{x:560,y:205,w:38,h:130,material:"concrete"},{x:710,y:205,w:30,h:130,material:"water"}]});
const normalStage=()=>({player:{x:80,y:H/2},shots:[],targets:[{x:790,y:70,w:48,h:48,hp:260,max:260,type:"normal",label:"標的A",speed:1.15},{x:820,y:210,w:42,h:78,hp:360,max:360,type:"human",label:"人体模型",speed:.95},{x:790,y:395,w:48,h:48,hp:280,max:280,type:"normal",label:"標的B",speed:1.3}],barriers:[{x:410,y:45,w:18,h:115,material:"paper"},{x:465,y:185,w:22,h:135,material:"water"},{x:410,y:370,w:24,h:110,material:"aluminum"},{x:610,y:32,w:32,h:448,material:"concrete"}]});

function App(){
 const canvasRef=useRef(null),gameRef=useRef(normalStage()),mouseRef=useRef({x:650,y:270}),modeRef=useRef("menu"),difficultyRef=useRef("normal"),resultRef=useRef(null),scoreRef=useRef(0),frameRef=useRef(0),stepRef=useRef(0),phaseRef=useRef("radiation");
 const [mode,setMode]=useState("menu"),[difficulty,setDifficulty]=useState("normal"),[weapon,setWeapon]=useState("alpha"),[score,setScore]=useState(0),[status,setStatus]=useState(""),[result,setResult]=useState(null);
 const setScoreSafe=v=>{scoreRef.current=v;setScore(v)},addScore=v=>setScoreSafe(scoreRef.current+v),setResultSafe=v=>{resultRef.current=v;setResult(v)};
 const showDifficulty=()=>{modeRef.current="difficulty";setMode("difficulty");setResultSafe(null);setStatus("難易度を選択してください")};
 const startStage=nextMode=>{gameRef.current=nextMode==="tutorial"?radiationDemoStage():normalStage();modeRef.current=nextMode;phaseRef.current="radiation";frameRef.current=0;stepRef.current=0;resultRef.current=null;setMode(nextMode);setResult(null);setScoreSafe(0);setWeapon("alpha");setStatus(nextMode==="tutorial"?"放射線の性質を説明します":"マウスで照準、1～4キーで放射線を発射します")};
 const selectDifficulty=level=>{difficultyRef.current=level;setDifficulty(level);startStage("playing")};
 const launchPoint=(kind,tx,ty,demo=false)=>{const g=gameRef.current,w=WEAPONS[kind],sx=g.player.x+30,sy=g.player.y,dx=tx-sx,dy=ty-sy,len=Math.hypot(dx,dy)||1;mouseRef.current={x:tx,y:ty};g.shots.push({kind,x:sx,y:sy,vx:dx/len*w.speed,vy:dy/len*w.speed,age:0,life:demo?180:w.life,damage:demo?999:w.damage,color:w.color,passed:new Set(),hit:false,demo});setWeapon(kind)};
 useEffect(()=>{const onKey=e=>{const map={Digit1:"alpha",Numpad1:"alpha",Digit2:"beta",Numpad2:"beta",Digit3:"gamma",Numpad3:"gamma",Digit4:"neutron",Numpad4:"neutron"},kind=map[e.code];if(!kind||e.repeat||modeRef.current!=="playing")return;e.preventDefault();launchPoint(kind,mouseRef.current.x,mouseRef.current.y,false);setStatus(`${WEAPONS[kind].name}を発射しました`)};window.addEventListener("keydown",onKey);return()=>window.removeEventListener("keydown",onKey)},[]);
 useEffect(()=>{const canvas=canvasRef.current,ctx=canvas.getContext("2d");let raf;const loop=()=>{const g=gameRef.current;
  if(modeRef.current==="tutorial"&&!resultRef.current){frameRef.current+=1;const radiationActions=[{at:180,type:"explain",index:0,kind:"gamma",text:"γ線：3キーで放射します。遠距離へ素早く届きます。"},{at:360,type:"target",index:0,kind:"gamma"},{at:540,type:"explain",index:1,kind:"neutron",text:"中性子線：4キーで放射します。人体模型に高い効果があります。"},{at:720,type:"target",index:1,kind:"neutron"},{at:900,type:"explain",index:2,kind:"beta",text:"β線：中程度の距離に届く放射線"},{at:1080,type:"target",index:2,kind:"beta"},{at:1260,type:"explain",index:3,kind:"alpha",text:"α線：1キーで放射します。近距離で高い効果があります。"},{at:1440,type:"target",index:3,kind:"alpha"},{at:1620,type:"next",text:"次に、遮へい材の性質を説明します。"}];const shieldActions=[{at:60,type:"explain",index:0,kind:"alpha",text:"紙はα線を防ぎます。"},{at:240,type:"barrier",index:0,kind:"alpha"},{at:420,type:"explain",index:1,kind:"beta",text:"アルミニウムはα線とβ線を防ぎます。"},{at:600,type:"barrier",index:1,kind:"beta"},{at:780,type:"explain",index:2,kind:"gamma",text:"コンクリートはα線とβ線を防ぎ、γ線を弱めます。"},{at:960,type:"barrier",index:2,kind:"gamma"},{at:1140,type:"explain",index:3,kind:"neutron",text:"水は中性子線のみ防ぎます。"},{at:1320,type:"barrier",index:3,kind:"neutron"},{at:1500,type:"clear",text:"放射線と遮へい材のチュートリアルが完了しました。"}];const actions=phaseRef.current==="radiation"?radiationActions:shieldActions,action=actions[stepRef.current];if(action&&frameRef.current>=action.at){if(action.type==="explain"){const item=phaseRef.current==="radiation"?g.targets[action.index]:g.barriers[action.index];mouseRef.current={x:item.x+item.w/2,y:item.y+item.h/2};setWeapon(action.kind);setStatus(action.text)}else if(action.type==="target"){const t=g.targets[action.index];launchPoint(action.kind,t.x+t.w/2,t.y+t.h/2,true)}else if(action.type==="barrier"){const b=g.barriers[action.index];launchPoint(action.kind,b.x+b.w/2,b.y+b.h/2,true)}else if(action.type==="next"){setStatus(action.text);gameRef.current=shieldDemoStage();phaseRef.current="shield";frameRef.current=0;stepRef.current=-1}else if(action.type==="clear"){setStatus(action.text);setResultSafe("clear")}stepRef.current+=1}}
  ctx.clearRect(0,0,W,H);const grad=ctx.createLinearGradient(0,0,W,H);grad.addColorStop(0,"#071426");grad.addColorStop(1,"#10213b");ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.fillStyle="rgba(14,165,233,.1)";ctx.fillRect(0,0,145,H);ctx.fillStyle="#94a3b8";ctx.font="12px sans-serif";ctx.fillText("DEFENSE ZONE",22,24);
  g.barriers.forEach(b=>{const m=MATERIALS[b.material];ctx.globalAlpha=.85;ctx.fillStyle=m.color;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.globalAlpha=1;ctx.save();ctx.translate(b.x+b.w/2,b.y+b.h/2);ctx.rotate(-Math.PI/2);ctx.fillStyle=b.material==="paper"?"#000000":"#e2e8f0";ctx.textAlign="center";ctx.font="bold 12px sans-serif";ctx.fillText(m.label,0,4);ctx.restore()});
  const angle=Math.atan2(mouseRef.current.y-g.player.y,mouseRef.current.x-g.player.x);ctx.save();ctx.translate(g.player.x,g.player.y);ctx.rotate(angle);ctx.fillStyle="#64748b";ctx.fillRect(0,-7,50,14);ctx.restore();ctx.fillStyle="#e2e8f0";ctx.beginPath();ctx.arc(g.player.x,g.player.y,22,0,Math.PI*2);ctx.fill();
  if(modeRef.current==="playing"&&!resultRef.current)g.targets.forEach(t=>{if(t.hp<=0)return;t.x-=t.speed*DIFFICULTIES[difficultyRef.current].factor;if(t.x<140&&!resultRef.current){t.hp=0;setScoreSafe(0);setResultSafe("gameover");setStatus("防衛ラインを突破されました")}});
  g.targets.forEach(t=>{if(t.hp<=0)return;ctx.fillStyle=t.type==="human"?"#c4b5fd":"#f1f5f9";if(t.type==="human"){ctx.beginPath();ctx.arc(t.x+t.w/2,t.y+15,14,0,Math.PI*2);ctx.fill();ctx.fillRect(t.x+9,t.y+30,24,39)}else ctx.fillRect(t.x,t.y,t.w,t.h);ctx.fillStyle="#0f172a";ctx.fillRect(t.x,t.y-18,t.w,7);ctx.fillStyle="#38bdf8";ctx.fillRect(t.x,t.y-18,t.w*Math.max(0,t.hp/t.max),7);ctx.fillStyle="#cbd5e1";ctx.textAlign="left";ctx.fillText(t.label,t.x,t.y-25)});
  g.shots.forEach(s=>{s.age+=1;s.x+=s.vx;s.y+=s.vy;if(s.kind==="beta"){const nx=-s.vy/WEAPONS.beta.speed,ny=s.vx/WEAPONS.beta.speed,wiggle=Math.sin(s.age*.7)*3;s.x+=nx*wiggle;s.y+=ny*wiggle}g.barriers.forEach(b=>{if(s.hit||s.passed.has(b))return;if(s.x>b.x&&s.x<b.x+b.w&&s.y>b.y&&s.y<b.y+b.h){s.passed.add(b);const blocked=s.kind==="alpha"||(s.kind==="beta"&&["water","aluminum","concrete"].includes(b.material))||(s.kind==="neutron"&&b.material==="water");if(blocked)s.hit=true;else if(s.kind==="gamma"&&b.material==="concrete")s.damage*=.28}});if(s.kind==="gamma"){ctx.strokeStyle=s.color;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(s.x-s.vx*5,s.y-s.vy*5);ctx.lineTo(s.x,s.y);ctx.stroke()}else{ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x,s.y,s.kind==="alpha"?8:5,0,Math.PI*2);ctx.fill()}g.targets.forEach(t=>{if(t.hp<=0||s.hit)return;if(s.x>t.x&&s.x<t.x+t.w&&s.y>t.y&&s.y<t.y+t.h){let damage=s.damage;if(!s.demo&&s.kind==="neutron")damage=t.type==="human"?90:3;t.hp-=damage;s.hit=true;if(t.hp<=0){const ratio=Math.max(0,Math.min(1,(t.x-140)/(W-140))),gained=Math.round(150+ratio*650)+(s.kind==="alpha"?700:0)+(s.kind==="neutron"&&t.type==="human"?300:0);addScore(gained);setStatus(s.demo?`${WEAPONS[s.kind].name}で撃破、SCORE +${gained}`:`${WEAPONS[s.kind].name}で撃破！ +${gained}`)}}})});g.shots=g.shots.filter(s=>!s.hit&&s.age<s.life&&s.x>-40&&s.x<W+40&&s.y>-40&&s.y<H+40);
  if(!resultRef.current&&modeRef.current==="playing"&&g.targets.every(t=>t.hp<=0)){setResultSafe("clear");setStatus("すべての標的を防ぎました")};ctx.strokeStyle="#38bdf8";ctx.beginPath();ctx.arc(mouseRef.current.x,mouseRef.current.y,11,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(mouseRef.current.x-17,mouseRef.current.y);ctx.lineTo(mouseRef.current.x+17,mouseRef.current.y);ctx.moveTo(mouseRef.current.x,mouseRef.current.y-17);ctx.lineTo(mouseRef.current.x,mouseRef.current.y+17);ctx.stroke();raf=requestAnimationFrame(loop)};loop();return()=>cancelAnimationFrame(raf)},[]);
 const moveAim=e=>{if(modeRef.current!=="playing")return;const r=e.currentTarget.getBoundingClientRect();mouseRef.current={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
 return <div className="min-h-screen bg-slate-950 text-white p-5 flex items-center justify-center"><div className="w-full max-w-5xl relative"><div className="absolute right-0 -top-4 text-[10px] tracking-wide text-slate-400 whitespace-nowrap">© NUCLEAR SAFETY TECHNOLOGY CENTER</div>
 <div className="flex justify-between items-end mb-3"><div><div className="text-xs tracking-[.25em] text-sky-300">RADIATION LAB / AUTO TUTORIAL</div><h1 className="text-3xl font-bold">放射線シューティング<span className="text-xl ml-1">～放射線教育ゲーム～</span></h1></div><div className="flex gap-6 items-end"><div><div className="text-xs text-slate-400 mb-1">DIFFICULTY</div><div className="px-3 py-1 rounded-lg text-xs font-bold bg-sky-500 text-slate-950">{DIFFICULTIES[difficulty].label}</div></div><div className="text-right"><div className="text-xs text-slate-400">SCORE</div><div className="text-2xl font-mono">{score}</div></div></div></div>
 <div className="rounded-2xl overflow-hidden border border-slate-700 shadow-2xl relative"><canvas ref={canvasRef} width={W} height={H} onMouseMove={moveAim} className={`w-full ${mode==="playing"?"cursor-none":"cursor-default"}`}/>{mode==="menu"&&<div className="absolute inset-0 bg-slate-950/85 grid place-items-center"><div className="bg-slate-900 border border-sky-500 rounded-2xl p-8 text-center"><div className="text-3xl font-bold">放射線の性質をゲームで学びましょう</div><p className="text-slate-400 mt-3">放射線の特徴を使い分けて、標的を撃破しましょう。</p><button onClick={showDifficulty} className="mt-6 px-8 py-3 rounded-xl bg-sky-500 text-slate-950 font-bold">ゲームスタート</button></div></div>}{mode==="difficulty"&&<div className="absolute inset-0 bg-slate-950/90 grid place-items-center"><div className="bg-slate-900 border border-sky-500 rounded-2xl p-8 text-center w-[90%] max-w-2xl"><div className="text-3xl font-bold">難易度を選択してください</div><div className="grid grid-cols-3 gap-4 mt-6">{Object.entries(DIFFICULTIES).map(([k,d])=><button key={k} onClick={()=>selectDifficulty(k)} className="p-5 rounded-xl bg-sky-600 font-bold"><div className="text-xl">{d.label}</div><div className="text-xs mt-2 font-normal">敵の速度 {Math.round(d.factor*100)}%</div></button>)}</div><div className="mt-6 pt-5 border-t border-slate-700"><button onClick={()=>startStage("tutorial")} className="px-5 py-2 rounded-xl border border-sky-500 text-sky-300 font-bold">チュートリアルへ</button></div></div></div>}{mode==="tutorial"&&!result&&<div className="absolute top-3 left-1/2 -translate-x-1/2 w-[88%] bg-sky-950/95 border border-sky-500 rounded-xl px-5 py-3 text-center text-sm"><div className="font-bold text-sky-300 mb-1">{phaseRef.current==="radiation"?"放射線の説明":"遮へい材の説明"}</div><div>{status}</div></div>}{result&&<div className="absolute inset-0 bg-slate-950/75 grid place-items-center"><div className="bg-slate-900 border border-sky-400 rounded-2xl p-8 text-center"><div className={`text-4xl font-black ${result==="clear"?"text-sky-300":"text-red-400"}`}>{mode==="tutorial"&&result==="clear"?"ARE YOU OK?":result==="clear"?"STAGE CLEAR":"GAME OVER"}</div>{mode==="tutorial"&&result==="clear"?<div className="mt-5 grid grid-cols-2 gap-4 w-72 mx-auto"><button onClick={()=>startStage("tutorial")} className="w-full px-5 py-2 rounded-xl bg-slate-700 font-bold">もう一度</button><button onClick={showDifficulty} className="w-full px-5 py-2 rounded-xl bg-sky-500 text-slate-950 font-bold">プレイ</button></div>:<><div className="mt-2 text-xl">SCORE {result==="gameover"?0:score}</div><button onClick={showDifficulty} className="mt-5 px-5 py-2 rounded-xl bg-sky-500 text-slate-950 font-bold">難易度選択に戻る</button></>}</div></div>}</div>
 <div className="mt-3 text-center text-slate-300 min-h-6">{status}</div><div className="grid grid-cols-4 gap-3 mt-3">{Object.entries(WEAPONS).map(([k,w],i)=><div key={k} className={`p-3 rounded-2xl border ${weapon==k?"bg-slate-800 border-sky-400":"bg-slate-900 border-slate-700"}`}><div className="flex justify-between"><b style={{color:w.color}}>{w.name}</b><span className="text-xs text-slate-500">[{i+1}]</span></div><div className="text-xs text-slate-400 mt-1">{w.desc}</div></div>)}</div><div className="mt-3 text-xs text-slate-500 text-center">通常プレイ：マウスで照準 ／ 1: α線　2: β線　3: γ線　4: 中性子線</div></div></div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
